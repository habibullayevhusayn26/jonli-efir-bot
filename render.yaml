services:
  - type: web
    name: telegram-live-stream-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: telegram_live_stream_bot
      - key: MAX_PREVIEWS
        value: "1"
