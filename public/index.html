<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17212b">
    <title>Stream preview</title>
    <link rel="stylesheet" href="/assets/app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/assets/hls.min.js" defer></script>
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="eyebrow">LIVE STREAM</div>
        <h1>Stream preview</h1>
        <p id="status" role="status">Telegram sessiyasi tekshirilmoqda…</p>
      </header>
      <div class="player-shell">
        <video id="player" controls playsinline muted></video>
        <div id="placeholder" class="placeholder">Preview tayyorlanmoqda…</div>
      </div>
      <div class="actions">
        <button id="sound-button" class="secondary" type="button" hidden>🔊 Ovoz yoqish</button>
        <button id="stop-button" class="danger" type="button" hidden>Preview’ni to‘xtatish</button>
      </div>
      <p class="note">Preview vaqtinchalik. U 5 daqiqadan so‘ng avtomatik to‘xtaydi.</p>
    </main>
  </body>
</html>
